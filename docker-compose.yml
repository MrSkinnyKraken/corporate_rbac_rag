# =============================================================================
# Zero-Trust RAG — local infrastructure stack.
#
# Brings up every on-premise service the demo depends on:
#
#   * chromadb  — vector store,     host port 8001  -> container 8000
#   * ollama    — local LLM,        host port 11434 -> container 11434
#   * api       — FastAPI service,  host port 8000  -> container 8000
#   * streamlit — frontend (demo),  host port 8501  -> container 8501
#
# All persistent state lives under ./data/ (chroma index, ollama models,
# bm25 indexes, raw uploads). The HuggingFace embedder cache is held in
# the named volume `hf_cache` so model downloads survive image rebuilds.
#
# IMPORTANT: if you have a host-side `ollama serve` running, stop it first
# (port 11434 conflict). On Windows that is the Ollama tray app or:
#   taskkill /IM ollama.exe /F
#
# Two operating modes:
#   * Full compose: `docker compose up -d`  (everything in containers)
#   * Hybrid dev:   `docker compose up -d chromadb ollama` + run the api
#                   natively via `python -m scripts.run_api --reload`
# =============================================================================

services:

  # ───────────────────────────── ChromaDB ──────────────────────────────────
  chromadb:
    # Pinned to match the Python client (chromadb==0.4.24 in requirements.txt).
    # `:latest` serves the v2 API, which the 0.4.x client cannot consume.
    image: chromadb/chroma:0.4.24
    container_name: zero_trust_chromadb
    ports:
      - "8001:8000"               # host:container
    volumes:
      - ./data/chroma_db:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE          # development convenience — drop in production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────── Ollama ──────────────────────────────────
  ollama:
    # Pinned for reproducibility. Bump together with any client-library upgrade.
    image: ollama/ollama:0.4.2
    container_name: zero_trust_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama       # persisted models (~2 GB each)
    environment:
      - OLLAMA_HOST=0.0.0.0:11434         # listen on every interface in container
      - OLLAMA_KEEP_ALIVE=24h             # keep models hot in RAM between requests
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}  # taken from project's .env
    # Override the default entrypoint to start the server AND auto-pull the
    # configured model on first run. The pull is idempotent: subsequent
    # restarts skip the download because the model is cached in the volume.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVE_PID=$$!
        echo "[ollama-init] waiting for the API to come up ..."
        for i in $$(seq 1 30); do
          if ollama list >/dev/null 2>&1; then
            echo "[ollama-init] API ready after $${i}s."
            break
          fi
          sleep 1
        done
        echo "[ollama-init] ensuring model '$$OLLAMA_MODEL' is present ..."
        ollama pull "$$OLLAMA_MODEL" \
          || echo "[ollama-init] WARNING: pull failed; the server keeps running. Re-run 'docker exec zero_trust_ollama ollama pull $$OLLAMA_MODEL' once connectivity is restored."
        echo "[ollama-init] handing off to ollama serve (pid $$SERVE_PID)"
        wait $$SERVE_PID
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s          # longer: first run downloads ~2 GB

  # ─────────────────────────────── FastAPI ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zero_trust_api
    ports:
      - "8000:8000"
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # Settings overrides for container networking — services reach each
      # other by container hostname inside the compose network instead of
      # via the host-mapped ports.
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000              # internal port (NOT the host's 8001)
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - API_HOST=0.0.0.0              # accept connections from outside the container
      - API_PORT=8000
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - EMBEDDING_DEVICE=cpu          # GPU passthrough is out of scope for the demo
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
    volumes:
      # Bind-mount user-visible data so uploads, indexes and the demo
      # users fixture stay inspectable from the host.
      - ./data/raw_docs:/app/data/raw_docs
      - ./data/bm25_indexes:/app/data/bm25_indexes
      - ./data/artifacts:/app/data/artifacts
      - ./data/demo_users.json:/app/data/demo_users.json:ro
      # Named volume for the HuggingFace transformers cache (~120 MB) so
      # rebuilds do not re-download the embedder.
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────── Streamlit ───────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: zero_trust_streamlit
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Inside the compose network the frontend reaches the api by its
      # service name (NOT the host-mapped localhost:8000).
      - API_URL=http://api:8000
    volumes:
      # Bind-mount the frontend source so host edits are visible inside
      # the container without rebuilding the image. Streamlit's built-in
      # file-watcher picks up `.py` changes and prompts a "Rerun" in the
      # browser. For production-style builds (no host code reachable),
      # comment this out and the COPY in the Dockerfile takes over.
      - ./frontend:/app/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  hf_cache:
